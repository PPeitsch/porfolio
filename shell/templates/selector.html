<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Use the name from loaded CV data -->
    <title>{{ cv.get('name', 'Portfolio') }} - Select Your Experience</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link to your custom CSS (even if empty for now) -->
    <link rel="stylesheet" href="{{ url_for('shell.static', filename='css/style.css') }}">
    <!-- Optional: Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        /* Custom styles if needed */
        html, body { height: 100%; margin: 0; }
        body { background-color: #f4f7f6; /* Slightly off-white */ font-family: system-ui, sans-serif; }
        .selector-card {
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
            border: 1px solid #e5e7eb; /* gray-200 */
        }
        .selector-card:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1), 0 5px 10px -6px rgba(0, 0, 0, 0.1); /* shadow-lg variant */
        }
        /* Ensure view container covers everything when active */
        #view-container.active {
             display: block; /* or flex, grid depending on content */
             position: fixed; /* Cover viewport */
             top: 0; left: 0;
             width: 100%; height: 100%;
             background-color: #fff; /* Default background for views */
             z-index: 10;
             overflow-y: auto; /* Allow scrolling within the view */
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- Selector Container -->
    <div id="selector-container" class="text-center p-6 md:p-10 max-w-5xl w-full mx-auto">
        <!-- Use name from cv data -->
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">{{ cv.get('name', 'Welcome') }}</h1>
        <p class="text-lg text-gray-600 mb-10 md:mb-16">How would you like to explore my portfolio?</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-10">

            <!-- Developer / CLI Option -->
            <div id="select-cli" class="selector-card bg-white p-6 md:p-8 rounded-xl shadow-sm cursor-pointer text-center">
                <i class="fas fa-terminal fa-3x text-emerald-500 mb-5"></i>
                <h2 class="text-xl font-semibold text-gray-700 mb-1">Developer</h2>
                <p class="text-gray-500 text-sm">Interactive CLI experience.</p>
            </div>

            <!-- Recruiter / CYOA Option -->
            <div id="select-recruiter" class="selector-card bg-white p-6 md:p-8 rounded-xl shadow-sm cursor-pointer text-center">
                <i class="fas fa-route fa-3x text-sky-500 mb-5"></i>
                <h2 class="text-xl font-semibold text-gray-700 mb-1">Recruiter</h2>
                <p class="text-gray-500 text-sm">Guided skills & impact tour.</p>
            </div>

            <!-- Visual / Simple Option -->
            <div id="select-visual" class="selector-card bg-white p-6 md:p-8 rounded-xl shadow-sm cursor-pointer text-center">
                <i class="fas fa-eye fa-3x text-indigo-500 mb-5"></i>
                <h2 class="text-xl font-semibold text-gray-700 mb-1">Visual</h2>
                <p class="text-gray-500 text-sm">Quick graphical overview.</p>
            </div>

        </div>
    </div>

    <!-- View Container - Initially hidden, covers screen when active -->
    <div id="view-container" class="hidden">
         <!-- Content injected here -->
          <button id="back-button" class="fixed top-4 left-4 bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-md text-sm shadow-sm z-20 hidden">← Back</button>
    </div>

    <!-- Load Selector JS -->
    <script src="{{ url_for('shell.static', filename='js/selector.js') }}"></script>
</body>
</html>
