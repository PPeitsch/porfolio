[tool.mypy]
# Basic MyPy configuration
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true


[tool.isort]
profile = "black"
line_length = 88
skip_glob = ["*/venv/*", "*/.venv/*", "*/env/*", "*/ENV/*"]


[tool.black]
line-length = 88
exclude = '''
/(
   \.git | \.hg | \.mypy_cache | \.tox | \.venv | venv | env | ENV
 | _build | buck-out | build | dist
)/
'''

# New section for Bandit configuration
[tool.bandit]
exclude_dirs = ["./venv", "./.venv"]
skips = ["B101"]

# --- Project Schema Definition ---
[tool.portfolio]
# Project schema definition to ensure consistency across the application
project_schema = [
   "id",                # Unique identifier for the project
   "title",             # Display name of the project
   "image",             # Filename only, e.g., minidoro.png
   "short_description", # Brief overview for cards
   "description",       # Full project description
   "type",              # webapp, library, repo, etc.
   "technologies",      # List of technologies used
   "live_url",          # URL to live deployment (if applicable)
   "github_url",        # URL to GitHub repository
]


# Default values for optional fields
[tool.portfolio.default_values]
live_url = ""
image = "placeholder.svg"


# Project types and their display attributes
project_types = [
   "webapp",            # Web applications
   "library",           # Software libraries/packages
   "repo",              # General repositories
   "tool",              # Command-line or utility tools
   "api",               # API services
   "mobile",            # Mobile applications
]


# Example projects (for schema reference)
[[tool.portfolio.projects]]
id = "portfolio"
title = "Unified Portfolio"
image = "portfolio.png"
short_description = "Multi-persona portfolio website with CLI, recruiter, and visual views"
description = """
A modern, multi-view portfolio website built with Flask, showcasing projects and skills tailored to different audiences (Developers, Recruiters, General Visitors).
Features include: interactive CLI interface, 'Choose Your Own Adventure' recruiter path, and a clean visual overview of projects.
"""
type = "webapp"
technologies = ["Python", "Flask", "JavaScript", "Tailwind CSS", "YAML", "Jinja2"]
github_url = "https://github.com/PPeitsch/porfolio"
live_url = "https://ppeitsch.com.ar"


[[tool.portfolio.projects]]
id = "cli-view"
title = "Terminal Portfolio Experience"
image = "cli-view.png"
short_description = "Interactive command-line interface for developers"
description = """
Developer-focused view that simulates a command-line interface within the browser.
Features include custom commands to explore projects, experience, and skills in a familiar terminal environment.
"""
type = "webapp"
technologies = ["Python", "Flask", "JavaScript", "xterm.js", "YAML"]
github_url = "https://github.com/PPeitsch/porfolio"
live_url = "https://ppeitsch.com.ar/cli"


[[tool.portfolio.projects]]
id = "recruiter-view"
title = "Recruiter Story Path"
image = "recruiter-view.png"
short_description = "Interactive 'Choose Your Own Adventure' for recruiters"
description = """
Guided story experience designed for recruiters and hiring managers.
Features a 'Choose Your Own Adventure' style navigation that highlights relevant skills,
projects, and experience based on the visitor's interests and needs.
"""
type = "webapp"
technologies = ["Python", "Flask", "JavaScript", "Tailwind CSS", "YAML", "Jinja2"]
github_url = "https://github.com/PPeitsch/porfolio"
live_url = "https://ppeitsch.com.ar/recruiter"


[[tool.portfolio.projects]]
id = "visual-view"
title = "Visual Project Gallery"
image = "visual-view.png"
short_description = "Clean, visual presentation of key projects and skills"
description = """
Minimalist visual overview of projects, skills, and experience.
Features responsive cards, filterable project gallery, and a clean design
that emphasizes visuals over text for a quick impression of capabilities.
"""
type = "webapp"
technologies = ["Python", "Flask", "JavaScript", "Tailwind CSS", "YAML", "Jinja2"]
github_url = "https://github.com/PPeitsch/porfolio"
live_url = "https://ppeitsch.com.ar/visual"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
