[tool.mypy]
# Basic MyPy configuration
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
# Define namespace packages if necessary (usually not needed for this structure)
# namespace_packages = true

# --- Optional: Stricter settings (enable gradually) ---
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# check_untyped_defs = true
# no_implicit_optional = true
# warn_redundant_casts = true
# warn_unused_ignores = true


# [[tool.mypy.overrides]]
# module = "flask.*"
# ignore_missing_imports = true # If flask-stubs causes issues

[tool.isort]
profile = "black"
line_length = 88 # Ensure consistency

[tool.black]
line-length = 88
# target-version = ['py310'] # Optional: Specify target versions if needed
