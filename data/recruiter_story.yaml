# Example:
library_overview:
  text: |
    I've developed reusable Python libraries, focusing on clear APIs and good documentation. The main public example is:

    {{ project_list_library }}

    This involved understanding external APIs, handling data fetching/parsing, and packaging for PyPI.
  choices:
    - { text: "More details on the BCRA Connector.", next_step: project_detail_bcra-connector }
    - { text: "Did you document it?", next_step: project_docs_bcra-connector }
    - { text: "What other project types?", next_step: project_type_overview }
    - { text: "Back to start.", next_step: start }

data_analysis_overview:
  text: |
    My background includes exploratory data analysis, often as preliminary work for larger projects. Key activities involved:

    *   Using Pandas for data manipulation and cleaning.
    *   Basic statistical analysis and generating insights.
    *   Creating visualizations (Matplotlib, Seaborn) - examples in the repo below.

    Main Example:
    *   **Economic Analysis Repo:** {{ desc_economic-analysis }}
  choices:
    - { text: "Explore the Economic Analysis Repo details.", next_step: project_detail_economic-analysis }
    - { text: "What tools did you use besides Pandas?", next_step: data_tools_detail } # Define
    - { text: "See other project types.", next_step: project_type_overview }
    - { text: "Back to start.", next_step: start }


# --- Default/Error Step ---
step_not_found:
  text: |
    Apologies, I seem to have lost my place or that specific path isn't fully detailed yet.
    How about we try one of these?
  choices:
    - { text: "Go back to the start.", next_step: start }
    - { text: "Explore web projects.", next_step: web_apps_overview }
    - { text: "See core skills.", next_step: core_skills }
