# Optional. The engine brings every text of the interface (terminal commands,
# manual pages, chat tool descriptions, translations under `ui`) in
# app/defaults/text_config.yaml. This file only needs what you want to change:
# its keys are merged over the engine's ones, so anything left out keeps the
# engine's text.
#
# Any text can be a plain string, shown in every language, or one translation
# per language code: { en: "...", es: "..." }. See PORTFOLIO_LANGUAGES.
# Placeholders like {name} are replaced with data from cv.yaml.

cli:
 # Shown after the CLI access code is accepted.
 welcome: { en: "Welcome to {name}'s CLI portfolio!", es: "¡Bienvenido al portfolio en terminal de {name}!" }
 prompt:
   user: "developer"
   host: "flaskos"
 neofetch:
   # Logo shown by default: the <name> of logo/neofetch_logo_<name>.txt, from
   # this folder's logo/ or the engine's app/defaults/logo/.
   logo: "flask"
