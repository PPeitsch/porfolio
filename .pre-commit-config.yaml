repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.10
        # Black reads pyproject.toml automatically for line-length

  # isort - Python import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)
        # isort reads pyproject.toml automatically for profile=black

  # Flake8 - Python linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        # --- Explicitly pass arguments ---
        args: [
            "--max-line-length=88",
            "--extend-ignore=E203,W503,E501",
            # Add --exclude argument here
            "--exclude=.git,__pycache__,venv,.venv,env,ENV,instance,migrations,dist,build",
            "--per-file-ignores=shell/__init__.py:F541 view_cli/__init__.py:E402,F401 view_recruiter/__init__.py:E402,F401 view_visual/__init__.py:E402,F401"
          ]

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0
    hooks:
      - id: mypy
        # MyPy reads pyproject.toml reliably
        additional_dependencies: [
          "Flask>=2.3", "PyYAML>=6.0", "python-dotenv>=1.0",
          "types-PyYAML>=6.0"
        ]
