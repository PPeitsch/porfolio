# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0 # Use the latest stable version
    hooks:
      - id: trailing-whitespace      # Trims trailing whitespace
      - id: end-of-file-fixer        # Ensures files end with a newline
      - id: check-yaml               # Checks yaml files for parseable syntax
      - id: check-added-large-files  # Prevents committing large files
      - id: check-toml               # Checks toml files for parseable syntax

  # Black - Python code formatter
  - repo: https://github.com/psf/black
    rev: 24.4.2 # Use the latest stable version compatible with your Python
    hooks:
      - id: black
        language_version: python3.10 # Specify your python version

  # isort - Python import sorter
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2 # Use the latest stable version
    hooks:
      - id: isort
        name: isort (python)
        args: ["--profile", "black"] # Ensure compatibility with Black

  # Flake8 - Python linter
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0 # Use the latest stable version
    hooks:
      - id: flake8
        # Optionally add args like --config=setup.cfg if needed, but Flake8 usually finds it
        # args: ["--config=setup.cfg"]
        # Specify additional dependencies if flake8 plugins are used
        # additional_dependencies: [flake8-bugbear]

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.0 # Use the latest stable version
    hooks:
      - id: mypy
        # Pass arguments if necessary, like config file location
        # args: ["--config-file", "mypy.ini"] # MyPy usually finds pyproject.toml
        # Specify additional dependencies needed for mypy to run
        # (e.g., your project's requirements, specific stubs)
        additional_dependencies: [
            # Add libraries from requirements.txt that mypy needs to check
            "Flask>=2.3",
            "PyYAML>=6.0",
            "python-dotenv>=1.0",
            # Add needed stubs
            "types-PyYAML>=6.0"
            # Add flask-stubs if you install and use them
          ]
        # Consider running mypy only on changed files initially for speed
        # pass_filenames: true
        # entry: mypy --python-version 3.10 # Ensure version consistency
