<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo principal que cubre toda el área -->
  <rect x="0" y="0" width="400" height="180" fill="#f9fafb"/>

  <!-- Borde decorativo -->
  <rect x="10" y="10" width="380" height="160" rx="6" fill="none" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Icono central de monitor/documento -->
  <g transform="translate(200, 65)">
    <!-- Base del icono -->
    <rect x="-30" y="-25" width="60" height="45" rx="3" fill="#9ca3af"/>

    <!-- Base del monitor -->
    <rect x="-15" y="20" width="30" height="5" rx="1" fill="#6b7280"/>

    <!-- Pantalla interior -->
    <rect x="-25" y="-20" width="50" height="35" rx="2" fill="#f3f4f6"/>

    <!-- Elementos de texto en la pantalla -->
    <rect x="-20" y="-15" width="40" height="3" rx="1" fill="#d1d5db"/>
    <rect x="-20" y="-8" width="30" height="3" rx="1" fill="#d1d5db"/>
    <rect x="-20" y="-1" width="35" height="3" rx="1" fill="#d1d5db"/>
    <rect x="-20" y="6" width="25" height="3" rx="1" fill="#d1d5db"/>
  </g>

  <!-- Texto en español -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#6b7280" font-weight="bold">Imagen del proyecto no disponible</text>
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#9ca3af">Aquí se mostrará la captura del proyecto cuando esté disponible</text>

  <!-- Elementos decorativos en las esquinas -->
  <circle cx="20" cy="20" r="5" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="380" cy="20" r="5" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="20" cy="160" r="5" fill="none" stroke="#9ca3af" stroke-width="1"/>
  <circle cx="380" cy="160" r="5" fill="none" stroke="#9ca3af" stroke-width="1"/>
</svg>
