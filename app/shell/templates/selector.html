<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ cv.get('name', 'Portfolio') }} - Select Your Experience</title>
    <!-- Favicon Links -->
    <link rel="icon" href="{{ url_for('shell.static', filename='favicon.svg') }}" type="image/svg+xml">
    <!-- External CSS & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('shell.static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <!-- Inline styles for simple card hover effect -->
    <style>
        .selector-card { transition: transform 0.2s ease-out, box-shadow 0.2s ease-out; border: 1px solid #e5e7eb; }
        .selector-card:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1), 0 5px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center">

    <!-- ===== Main Selector View ===== -->
    <div id="selector-container" class="text-center p-6 md:p-10 max-w-5xl w-full mx-auto visible-view">
        <!-- Header Section -->
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">{{ cv.get('name', 'Welcome') }}</h1>
        <p class="text-lg text-gray-600 mb-10 md:mb-16">How would you like to explore my portfolio?</p>

        <!-- Options Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-10">

            <!-- Developer / CLI Option -->
            <div id="select-cli" class="selector-card bg-white p-6 md:p-8 rounded-xl shadow-sm cursor-pointer text-center">
                <i class="fas fa-terminal fa-3x text-emerald-500 mb-5"></i>
                <h2 class="text-xl font-semibold text-gray-700 mb-1">Developer</h2>
                <p class="text-gray-500 text-sm">Interactive CLI experience.</p>
            </div>

            <!-- Recruiter / Chat Option -->
            <div id="select-recruiter" class="selector-card bg-white p-6 md:p-8 rounded-xl shadow-sm cursor-pointer text-center">
                <i class="fas fa-comments fa-3x text-sky-500 mb-5"></i>
                <h2 class="text-xl font-semibold text-gray-700 mb-1">Recruiter</h2>
                <p class="text-gray-500 text-sm">AI-powered chat assistant.</p>
            </div>

            <!-- Visual / Simple Option -->
            <div id="select-visual" class="selector-card bg-white p-6 md:p-8 rounded-xl shadow-sm cursor-pointer text-center">
                <i class="fas fa-eye fa-3x text-indigo-500 mb-5"></i>
                <h2 class="text-xl font-semibold text-gray-700 mb-1">Visual</h2>
                <p class="text-gray-500 text-sm">Quick graphical overview.</p>
            </div>

        </div> <!-- End Options Grid -->
    </div> <!-- End Main Selector View -->


    <!-- ===== Dynamic View Container ===== -->
    <div id="view-container" class="hidden-view">
    </div>

    <!-- ===== View Navigation Dock ===== -->
    <div id="view-dock" class="view-dock">
        <!-- View Controls -->
        <button id="dock-home" class="dock-item" data-view="Home" aria-label="Go to Home Selector">
            <i class="fas fa-th-large"></i>
        </button>
        <div class="dock-separator"></div>
        <button id="dock-cli" class="dock-item" data-view="Developer" aria-label="Open Developer View">
            <i class="fas fa-terminal"></i>
        </button>
        <button id="dock-recruiter" class="dock-item" data-view="Recruiter" aria-label="Open Recruiter View">
            <i class="fas fa-comments"></i>
        </button>
        <button id="dock-visual" class="dock-item" data-view="Visual" aria-label="Open Visual View">
            <i class="fas fa-eye"></i>
        </button>

        <!-- Utility Controls -->
        <div class="dock-separator"></div>
        <button id="dock-theme-switcher" class="dock-item" data-view="Theme" aria-label="Switch Theme">
            <i class="fas fa-palette"></i>
        </button>
        {% if banner_enabled %}
        <div class="relative group">
            <button id="dock-info" class="dock-item" data-view="Info" aria-label="Show Info">
                <i class="fas fa-cog"></i>
            </button>
            <div class="config-tooltip group-hover:opacity-100 group-hover:visible">
                {{ banner_message }}
            </div>
        </div>
        {% endif %}
    </div>


    <!-- ===== Scripts ===== -->
    <script>
        // Pass Flask URLs to a global JS object
        const _app_urls = {
            view_cli: '{{ url_for("shell.get_view_partial", view_name="cli") }}',
            view_recruiter: '{{ url_for("shell.get_view_partial", view_name="recruiter") }}',
            view_visual: '{{ url_for("shell.get_view_partial", view_name="visual") }}',
            shared_window_css: '{{ url_for("shell.static", filename="css/window.css") }}',
            shared_themes_css: '{{ url_for("shell.static", filename="css/themes.css") }}',
            shared_window_js: '{{ url_for("shell.static", filename="js/window.js") }}',
            cli_css: '{{ url_for("cli.static", filename="css/terminal.css") }}',
            cli_js: '{{ url_for("cli.static", filename="js/terminal.js") }}',
            recruiter_css: '{{ url_for("recruiter.static", filename="css/chat.css") }}',
            recruiter_js: '{{ url_for("recruiter.static", filename="js/chat.js") }}',
            visual_css: '{{ url_for("visual.static", filename="css/visual.css") }}',
            visual_js: '{{ url_for("visual.static", filename="js/visual.js") }}',
        };
    </script>
    <script src="{{ url_for('shell.static', filename='js/selector.js') }}"></script>

</body>
</html>
