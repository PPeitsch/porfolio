<!-- This HTML fragment is loaded into #view-container -->
<div class="p-4 md:p-6 lg:p-8 flex items-center justify-center h-full">

    <!-- OS-style Draggable Window -->
    <div id="chat-window" class="os-window">
        <!-- Title Bar -->
        <div id="chat-title-bar" class="title-bar">
            <div class="title-text">
                <i class="fas fa-comments"></i>
                <span>AI Assistant</span>
            </div>
            <div class="window-controls">
                <span id="chat-minimize" class="control-btn minimize"></span>
                <span id="chat-maximize" class="control-btn maximize"></span>
                <span id="chat-close" class="control-btn close"></span>
            </div>
        </div>

        <!-- Chat Content -->
        <div id="chat-content" class="window-content">
            <!-- Message display area -->
            <div id="chat-messages">
                <!-- Chat bubbles will be dynamically inserted here -->
            </div>

            <!-- Input form area -->
            <div id="chat-input-container">
                <form id="chat-form" action="javascript:void(0);">
                    <input
                        type="text"
                        id="chat-input"
                        placeholder="Ask about my skills or projects..."
                        autocomplete="off"
                        required
                    />
                    <button type="submit" id="chat-send-button" aria-label="Send Message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

</div>
