<!-- This HTML fragment is loaded into #view-container -->
<div class="p-4 md:p-6 lg:p-8 flex items-center justify-center h-full relative">

    <!-- OS-style Draggable Window -->
    <div id="chat-window" class="os-window" data-welcome="{{ welcome }}" data-max-chars="{{ config.CHAT_MAX_MESSAGE_CHARS }}">
        <!-- Title Bar -->
        <div id="chat-title-bar" class="title-bar">
            <div class="title-text">
                <i class="fas fa-robot"></i>
                <span>{{ t('chat.window_title') }}</span>
            </div>
            <div class="window-controls">
                <span id="chat-minimize" class="control-btn minimize"></span>
                <span id="chat-maximize" class="control-btn maximize"></span>
                <span id="chat-close" class="control-btn close"></span>
            </div>
        </div>

        <!-- Chat Content -->
        <div class="window-content">
            <div id="chat-messages" class="flex-grow">
                <!-- Messages will be injected here by JS -->
            </div>
            <form id="chat-form" class="chat-input-area">
                <input type="text" id="chat-input" class="chat-input" placeholder="{{ t('chat.loading') }}" autocomplete="off" disabled>
                <button type="submit" id="chat-send-button" class="chat-send-button" disabled>
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>

            <!-- Notice shown when the chat refuses a message (too long, too many) -->
            <div id="chat-modal" class="chat-modal" role="alertdialog" aria-modal="true"
                 aria-labelledby="chat-modal-title" aria-describedby="chat-modal-text" hidden>
                <div class="chat-modal-box">
                    <h2 id="chat-modal-title" class="chat-modal-title"></h2>
                    <p id="chat-modal-text" class="chat-modal-text"></p>
                    <button type="button" id="chat-modal-close" class="chat-modal-button">{{ t('chat.modal_ok') }}</button>
                </div>
            </div>
        </div>
    </div>
</div>
