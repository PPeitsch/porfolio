<!-- This HTML fragment is loaded into #view-container -->
<div class="p-4 md:p-6 lg:p-8 flex items-center justify-center h-full">

    <!-- OS-style Draggable Window -->
    <div id="cli-window" class="os-window">
        <!-- Title Bar (Windows Style: Title Left, Controls Right) -->
        <div id="cli-title-bar" class="title-bar">
            <div class="title-text">
                <i class="fas fa-terminal"></i>
                <span>terminal</span>
            </div>
            <div class="window-controls">
                <span id="cli-minimize" class="control-btn minimize"></span>
                <span id="cli-maximize" class="control-btn maximize"></span>
                <span id="cli-close" class="control-btn close"></span>
            </div>
        </div>

        <!-- Terminal Content -->
        <div id="terminal-content" class="window-content">
            <div id="output" class="flex-grow">
            </div>
            <div id="input-line" class="input-line">
                <span id="prompt" class="prompt">portfolio:~ $</span>
                <input type="text" id="input" class="input" autofocus autocomplete="off" spellcheck="false" aria-label="Command Input">
            </div>
        </div>
    </div>

</div>
