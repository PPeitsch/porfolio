<!-- This is the HTML structure for the CLI view -->
<!-- It will be injected into the #view-container by selector.js -->
<!-- Styles are primarily handled by terminal.css -->
<div id="terminal" class="w-full h-full flex flex-col font-mono text-sm bg-[#1e1e2e] text-[#cdd6f4] rounded-lg overflow-hidden">
    <div id="output" class="flex-grow overflow-y-auto p-3 whitespace-pre-wrap break-words">
        <!-- JS will populate this -->
    </div>
    <div id="input-line" class="input-line flex p-2 border-t border-[#313244]">
        <span id="prompt" class="prompt text-[#89b4fa] mr-2 whitespace-nowrap">portfolio:~ $</span>
        <input type="text" id="input" class="input bg-transparent border-none text-[#cdd6f4] flex-grow outline-none caret-[#f5e0dc]" autofocus autocomplete="off" spellcheck="false" aria-label="Command Input">
    </div>
</div>
