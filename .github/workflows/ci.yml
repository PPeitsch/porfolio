name: Python CI Checks

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Step 1: Check out the repository code
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment for the current matrix version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Step 3: Install dependencies (including dev dependencies)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install dev dependencies if the file exists
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Step 4: Lint with Flake8
      # The --config flag points to the config file (setup.cfg or pyproject.toml)
      # Flake8 automatically finds setup.cfg/tox.ini/.flake8 in project root
      # Use --statistics to show counts, --count to show total errors
      - name: Lint with Flake8
        run: |
          # Pass arguments explicitly to ensure consistency with pre-commit
          flake8 . --count --show-source --statistics \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --per-file-ignores="shell/__init__.py:F541 view_cli/__init__.py:E402,F401 view_recruiter/__init__.py:E402,F401 view_visual/__init__.py:E402,F401"
          # Note: Shell continuation '\' used for readability
          # Ensure correct quoting for the per-file-ignores argument if needed by the shell

      # Step 5: Run Tests with Pytest (Placeholder - Add when tests exist)
      # - name: Test with Pytest
      #   run: |
      #     # pytest tests/ --cov=app --cov-report=xml
      #     echo "Test execution placeholder - No tests configured yet."

