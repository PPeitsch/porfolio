# .github/workflows/ci.yml

name: Python CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Step 1: Check out code
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Step 4: Lint with Flake8 (Explicit Args for Consistency)
      - name: Lint with Flake8
        run: |
          flake8 . --count --show-source --statistics \
            --max-line-length=88 \
            --extend-ignore=E203,W503,E501 \
            --exclude=.git,__pycache__,venv,.venv,env,ENV,instance,migrations,dist,build \
            --per-file-ignores=shell/__init__.py:F541 \
            --per-file-ignores=view_cli/__init__.py:E402,F401 \
            --per-file-ignores=view_recruiter/__init__.py:E402,F401 \
            --per-file-ignores=view_visual/__init__.py:E402,F401 \
            # ^^^ Use separate --per-file-ignores for each rule ^^^

      # Step 5: Run Type Checking with MyPy
      - name: Type Check with MyPy
        run: |
          # MyPy reads configuration reliably from pyproject.toml
          mypy .

      # Step 6: Run Tests with Pytest (Placeholder - Add when tests exist)
