name: Python CI Checks

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ] # Runs on pushes to main branch
  pull_request:
    branches: [ "main" ] # Runs on PRs targeting main branch
  workflow_dispatch: # Allows manual triggering from GitHub UI

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint-and-test: # Combine linting and testing (or separate jobs)
    runs-on: ubuntu-latest # Use the latest Ubuntu runner
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"] # Test on multiple Python versions

    steps:
      # Step 1: Check out the repository code
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment for the current matrix version
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip' # Cache dependencies

      # Step 3: Install dependencies (including dev dependencies)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install dev dependencies if the file exists
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      # Step 4: Lint with Flake8
      # The --config flag points to the config file (setup.cfg or pyproject.toml)
      # Flake8 automatically finds setup.cfg/tox.ini/.flake8 in project root
      # Use --statistics to show counts, --count to show total errors
      - name: Lint with Flake8
        run: |
          flake8 . --count --show-source --statistics
          # Optional: exit-zero treats all errors as warnings (useful initially)
          # flake8 . --count --exit-zero --show-source --statistics

      # Step 5: Run Tests with Pytest (Placeholder - Add when tests exist)
      # - name: Test with Pytest
      #   run: |
      #     # pytest tests/ --cov=app --cov-report=xml
      #     echo "Test execution placeholder - No tests configured yet."

      # Step 6: Upload Coverage Report (Placeholder - Add when tests run)
