name: Code Quality & Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run formatters and linters
        run: |
          black --check .
          isort --check-only .
          flake8 .
          mypy app tests

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Bandit (SAST)
        run: bandit -r . --exclude ./venv,./.venv -c pyproject.toml

      # The locks are fully pinned, so pip-audit reads them without installing anything.
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --disable-pip --no-deps -r requirements.txt -r requirements-dev.txt
