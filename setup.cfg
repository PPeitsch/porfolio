[flake8]
# Increase default line length (compatible with Black)
max-line-length = 88
# Extend default ignore list if needed, e.g.:
# ignore = E203, W503
# E203: whitespace before ':' (conflicts with Black)
# W503: line break before binary operator (PEP 8 changed preference)
extend-ignore = E203, W503
# Exclude directories like migrations, venv, etc.
exclude =
    .git,
    __pycache__,
    venv,
    .venv,
    env,
    ENV,
    instance,
    migrations,
    dist,
    build
# You might want to increase complexity threshold later if needed
# max-complexity = 10