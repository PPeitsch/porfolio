<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Menlo, Monaco, 'Consolas', 'Courier New', monospace">
    <!-- Define a filter for the window shadow -->
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            .blinking-cursor {
                animation: blink 1.2s step-end infinite;
            }
            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
        </style>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#e8e8e8"/>

    <!-- Window Group (with shadow filter applied) -->
    <g transform="translate(100, 80)" filter="url(#shadow)">
        <!-- Window Frame -->
        <rect x="0" y="0" width="600" height="340" rx="10" fill="#2d2d37"/>

        <!-- Title Bar -->
        <rect x="0" y="0" width="600" height="30" rx="10" ry="10" fill="#40404a"/>
        <path d="M0 20 V10 A10 10 0 0 1 10 0 H590 A10 10 0 0 1 600 10 V20 H0 Z" fill="#2d2d37"/>

        <!-- Traffic Light Controls -->
        <circle cx="20" cy="15" r="6" fill="#ff5f57"/>
        <circle cx="40" cy="15" r="6" fill="#ffbd2e"/>
        <circle cx="60" cy="15" r="6" fill="#27c93f"/>

        <!-- Title Text -->
        <text x="300" y="20" text-anchor="middle" font-size="13" fill="#c0c0c0" font-family="system-ui, sans-serif" font-weight="500">
            Terminal — zsh — PPeitsch Portfolio
        </text>

        <!-- Terminal Text Content -->
        <text y="55" font-size="14" fill="#e0e0e0">
            <tspan x="15" fill="#87d7ff">portfolio:~$</tspan>
            <tspan dx="10">ls projects</tspan>
        </text>
        <text y="80" font-size="14" fill="#e0e0e0">
            <tspan x="15">minidoro              financial-tracking    bcra-connector</tspan>
        </text>
        <text y="98" font-size="14" fill="#e0e0e0">
            <tspan x="15">automateiq            timetrack             pomodoro-app-svg</tspan>
        </text>
         <text y="116" font-size="14" fill="#e0e0e0">
            <tspan x="15">shape-dimensions-tool economic-analysis</tspan>
        </text>
        <text y="144" font-size="14" fill="#e0e0e0">
            <tspan x="15" fill="#87d7ff">portfolio:~$</tspan>
            <tspan dx="10">show automateiq</tspan>
        </text>
        <text y="170" font-size="14" fill="#a6e3a1">
            <tspan x="15">[INFO] Type: Webapp</tspan>
        </text>
         <text y="188" font-size="14" fill="#cdd6f4">
            <tspan x="15">  Automation platform integrating n8n with AI workflow</tspan>
            <tspan x="15" dy="1.2em">  generation using Anthropic's Claude API.</tspan>
        </text>
        <text y="232" font-size="14" fill="#f9e2af">
            <tspan x="15">[LINK] Links:</tspan>
        </text>
        <text y="250" font-size="14" fill="#cdd6f4">
            <tspan x="15">  - Live Demo: </tspan><tspan fill="#89dceb" style="text-decoration: underline;">https://automateiq...</tspan>
        </text>

        <!-- The text prompt and the cursor are now sibling elements -->
        <text y="278" font-size="14">
            <tspan x="15" fill="#87d7ff">portfolio:~$</tspan>
        </text>
        <!-- The cursor is a <rect> element positioned next to the text -->
        <rect class="blinking-cursor" x="135" y="266" width="8" height="15" fill="#f0f0f0"/>
        <!-- =================================================================== -->
    </g>
</svg>
