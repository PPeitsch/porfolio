<!-- This is the HTML structure for the Recruiter (CYOA) view -->
<!-- It will be injected into the #view-container by selector.js -->
<div id="cyoa-container" class="w-full h-full flex flex-col items-center justify-center p-6 md:p-12 lg:p-20 font-sans text-gray-800 overflow-y-auto">

    <div id="story-content" class="bg-white p-8 md:p-10 rounded-lg shadow-xl max-w-3xl w-full text-left transition-opacity duration-500 ease-in-out opacity-0">
        <!-- Narrative text will be loaded here -->
        <p id="story-text" class="text-lg leading-relaxed mb-8">
            Loading story...
        </p>

        <!-- Choices will be loaded here -->
        <div id="choices-container" class="border-t border-gray-200 pt-6 space-y-3">
            <!-- Example Choice structure (will be generated by JS) -->
            <!--
            <button class="cyoa-choice-button w-full text-left bg-blue-50 hover:bg-blue-100 text-blue-700 font-medium p-4 rounded-md transition duration-150 ease-in-out">
                Placeholder Choice
            </button>
            -->
        </div>
    </div>

    <!-- Optional: Progress indicator or chapter title can go here -->
    <div id="cyoa-status" class="mt-4 text-sm text-gray-500">
        <!-- Status updates -->
    </div>

</div>
