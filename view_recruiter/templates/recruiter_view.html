<!-- This HTML fragment is loaded into #view-container -->

<!-- Wrapper Div: Adds padding-top and enables vertical scrolling for the whole view -->
<div class="view-content-wrapper w-full h-full p-6 md:p-12 lg:p-16 flex flex-col items-center">
    <!-- CYOA Container: Centers the story box -->
    <div id="cyoa-container" class="w-full flex flex-col items-center justify-center">
        <!-- Story Content Box -->
        <div id="story-content" class="bg-white p-8 md:p-10 rounded-lg shadow-xl max-w-3xl w-full text-left transition-opacity duration-500 ease-in-out opacity-0 mb-4">
            <!-- Narrative Text Area -->
            <p id="story-text" class="text-lg leading-relaxed mb-8">
                Loading story...
            </p>
            <!-- Choices Area -->
            <div id="choices-container" class="border-t border-gray-200 pt-6 space-y-3">
                <!-- Choices generated by JS go here -->
            </div>
        </div>
        <!-- Status/Info Area -->
        <div id="cyoa-status" class="mt-4 text-sm text-gray-500 max-w-3xl w-full text-center">
            <!-- Status updates generated by JS (e.g., current step) -->
        </div>
    </div>
</div>
